body:
  - type: markdown
    attributes:
      value: |
        Ideas and game requests are welcome. The game this port runs, and the version, are on the [main page](https://github.com/P1R4N351/oot-android).
        **No game files, keys, firmware or links to them**: don't share them, offer them or ask where to get them. OoT Native works with your own dump of a game you own. Posts that break this are edited or removed ([rules](https://github.com/P1R4N351/oot-android#legal)).
  - type: textarea
    id: body
    attributes:
      label: Your idea
      description: "What you'd like, and why. For a feature, what it should do in Ocarina of Time (no files)."
    validations:
      required: true
  - type: checkboxes
    id: rules
    attributes:
      label: Rules
      options:
        - label: My post has no game files, keys, firmware or links to them, and doesn't ask for any.
          required: true
